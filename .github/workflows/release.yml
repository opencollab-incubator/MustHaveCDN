name: Release

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(./gradlew -q properties --property version | awk '/^version:/ {print $2}')
          TAG="v$VERSION-build.$GITHUB_RUN_NUMBER"
          gh release create "$TAG" build/libs/MustHaveCDN.jar \
            --target "$GITHUB_SHA" \
            --title "$VERSION (build $GITHUB_RUN_NUMBER)" \
            --prerelease \
            --generate-notes
